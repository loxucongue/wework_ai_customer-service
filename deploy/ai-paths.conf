server {
    listen 80;
    server_name 47.252.81.104;

    client_max_body_size 20m;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;

    location = /api/ai-paths/health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/ai/reply {
        return 410;
    }

    location = /api/ai/reply/workflow-compatible {
        return 410;
    }

    location = /api/ai-paths/chat {
        return 410;
    }

    location = /api/ai/chat {
        return 410;
    }

    location = /api/ai/chat/workflow-compatible {
        return 410;
    }

    location = /api/ai/reply/workflow-compatible-v2 {
        return 410;
    }

    location = /api/ai-paths/refactor-health {
        return 410;
    }

    location = /api/ai/callbacks/v1/message-delivery {
        allow 120.26.43.96;
        allow 121.199.0.182;
        deny all;
        proxy_pass http://127.0.0.1:8000/callbacks/v1/message-delivery;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Callback-Token $http_x_callback_token;
    }

    location = /api/ai/callbacks/v1/conversation-mode {
        allow 120.26.43.96;
        allow 121.199.0.182;
        deny all;
        proxy_pass http://127.0.0.1:8000/callbacks/v1/conversation-mode;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Callback-Token $http_x_callback_token;
    }

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
